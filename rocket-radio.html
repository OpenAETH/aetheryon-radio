<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rocket Radio · prototipo</title>
<style>
:root{--bg:#1a1030;--fg:#fff3e0;--mut:#b9a6d6;--ac:#ffb347;--pn:#2a1a4a}
@media(prefers-color-scheme:light){:root{--bg:#fff3e0;--fg:#2a1a4a;--mut:#6b5a8a;--pn:#ffe2b8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px}
canvas{width:min(100%,854px);aspect-ratio:854/480;border-radius:14px;background:#000}
.p{width:min(100%,854px);background:var(--pn);border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,input{font:inherit;padding:7px 11px;border-radius:8px;border:1px solid var(--mut);background:transparent;color:var(--fg)}
button{cursor:pointer}button:hover,button:focus-visible{border-color:var(--ac);outline:none}
#u{flex:1;min-width:200px}
#dl{width:70px}
#st,#help{color:var(--mut);font-size:12px}
#log{width:100%;max-height:84px;overflow:auto;color:var(--mut);font:12px ui-monospace,monospace}
body.emision{padding:0;gap:0;justify-content:center;height:100vh;overflow:hidden;background:#000}
body.emision canvas{width:min(100vw,calc(100vh*854/480));border-radius:0}
body.emision .p{display:none}
</style>
</head>
<body>
<canvas id="c" width="854" height="480" aria-label="Escena animada de Rocket Radio"></canvas>
<div class="p" id="panel">
  <button id="bd">Iniciar demo</button>
  <button id="bf">Pantalla completa (F)</button>
  <button id="bh">Modo emisión (H)</button>
  <input id="u" placeholder="URL de la radio, por ejemplo https://tu-radio.onrender.com">
  <button id="bc">Conectar a la radio</button>
  <label>Ajuste extra (s) <input id="dl" type="number" value="0" min="-10" max="30" step="0.5"></label>
  <span id="st">Sin conexión</span>
  <div id="log"></div>
  <div id="help">Teclas: F pantalla completa, H modo emisión (oculta este panel), 1 y 2 escenas, M música, N noticia, S spot, O y T emociones. Atajo: ?radio=URL&amp;modo=emision conecta solo.</div>
</div>
<script>
// ===== Datos: escenas y personajes (esto es lo que luego puede venir de un JSON) =====
const SCENES={
 bar:{sky:['#1b1040','#3b1a5e'],floor:'#241338',
  props:[{t:'rect',x:0,y:330,w:854,h:20,c:'#ff5d8f'},{t:'rect',x:560,y:250,w:240,h:80,c:'#3a2a5c'},
         {t:'text',x:427,y:80,s:'BAR GALÁCTICO',c:'#5ef2ff',f:'bold 42px system-ui'}],
  chars:{cap:{x:250,y:300},nova:{x:430,y:300}}},
 cabina:{sky:['#0f2a3d','#16475f'],floor:'#0b1c28',
  props:[{t:'rect',x:60,y:50,w:160,h:46,c:'#ff2d55',live:1},{t:'rect',x:150,y:330,w:560,h:24,c:'#2d6a8a'},
         {t:'text',x:140,y:83,s:'AL AIRE',c:'#fff',f:'bold 26px system-ui',live:1}],
  chars:{cap:{x:300,y:300},nova:{x:520,y:300}}}
};
const CHARS={cap:{body:'#ffb347',head:'#ffd9a0',name:'Cap'},nova:{body:'#5ef2ff',head:'#c8f7ff',name:'Nova'}};
// Estados de personaje: rebote, velocidad, apertura de boca, ojos, temblor
const STATES={
 idle:{bob:3,spd:1.5,mouth:0},serio:{bob:1,spd:1,mouth:0},talk:{bob:5,spd:3,mouth:1},dance:{bob:16,spd:5,mouth:.3},
 oh:{bob:2,spd:1,mouth:.9,eyes:1.6},tos:{bob:2,spd:2,shake:6,mouth:.4}
};

// ===== Estado y API pública =====
const RR=window.RocketRadio={analyser:null,delay:0,lag:null};
const S={fadeAt:0,track:'',mode:'music',t0:0,seg:-1,chyron:null,chAt:0,scene:'bar',title:'Esperando señal…',who:{cap:{st:'idle',until:0},nova:{st:'idle',until:0}}};
const $=id=>document.getElementById(id);
const log=t=>{const l=$('log');l.insertAdjacentHTML('afterbegin','<div>'+t+'</div>');while(l.children.length>30)l.lastChild.remove()};

// ===== Director: reglas evento → escena y estados =====
const setScene=n=>{if(SCENES[n]&&n!==S.scene){S.scene=n;S.fadeAt=performance.now()}};   // fundido al cambiar de escena
const setState=(c,st,ms)=>{const w=S.who[c];w.st=st;w.until=ms?performance.now()+ms:0};
const allState=st=>{for(const c in S.who)setState(c,st)};
let talkTimer=null,turn=0;
function stopTalk(){clearTimeout(talkTimer)}
function startTalk(base,react){
  stopTalk();
  const go=()=>{
    allState(base);
    const a=['cap','nova'][turn++%2],b=['cap','nova'][turn%2];
    setState(a,'talk');
    if(Math.random()<react)setState(b,Math.random()<.5?'oh':'tos',1200);
    talkTimer=setTimeout(go,3500+Math.random()*2500);
  };
  go();
}
// El faldón arranca con el ítem; "elapsed" (seg. ya transcurridos en el servidor) alinea los titulares con el audio
const show=(e,tag,mode)=>{
  S.mode=mode;S.title=tag+': '+(e.titulo||'');
  S.chyron={tag,headline:e.titulo,...e.chyron};
  S.t0=performance.now()-(e.elapsed||0)*1000;S.seg=-1;S.chAt=performance.now();S.mstart=e.mstart??null;
};
const RULES={
 music(e){stopTalk();S.mode='music';S.track=e.titulo||'';S.chAt=performance.now();setScene('bar');allState('dance');S.chyron=null;S.title='Música: '+(e.titulo||'en la radio')},
 news(e){setScene('cabina');show(e,'Noticia','news');startTalk('serio',.15)},
 spot(e){setScene('bar');show(e,'Spot','spot');startTalk('idle',.35)}
};
// Punto de entrada único: la radio, el demo o tu backend llaman a RocketRadio.emit(...)
RR.emit=(e,now)=>setTimeout(()=>{
  log(JSON.stringify(e));
  (RULES[e.tipo]||(()=>{}))(e);
  if(e.escena)setScene(e.escena);
  if(e.emocion)setState(e.quien||'cap',e.emocion,1500);
},now?0:Math.max(0,((RR.lag!=null&&performance.now()-ext.t<3000?RR.lag:3)+RR.delay)*1000));

RULES.music({});   // arranca bailando: sin noticia en el aire, la música manda

// ===== Nivel de voz para la boca =====
// Prioridad: 1) nivel real enviado por la pagina de escucha de la radio (BroadcastChannel),
// 2) un analizador propio en RocketRadio.analyser, 3) nivel simulado.
let ext={v:0,t:0},clk=null;
// Reloj del audio: posicion del <audio> del oyente (== reloj del encoder del servidor), extrapolada entre mensajes
const mediaNow=()=>clk&&performance.now()-clk.t<1500?clk.p+(performance.now()-clk.t)/1000-RR.delay:null;
if(typeof BroadcastChannel!=='undefined'){
  new BroadcastChannel('rocket-radio').onmessage=m=>{ext={v:m.data.level||0,t:performance.now()};if(typeof m.data.pos==='number'&&m.data.playing)clk={p:m.data.pos,t:performance.now()};if(typeof m.data.lag==='number')RR.lag=RR.lag==null?m.data.lag:RR.lag*.9+m.data.lag*.1};
}
const buf=new Uint8Array(256);let lv=0,real=false;
function level(t){
  let target;
  real=true;
  if(t-ext.t<500)target=ext.v;
  else if(RR.analyser){RR.analyser.getByteTimeDomainData(buf);let s=0;for(const v of buf)s+=Math.abs(v-128);target=Math.min(1,s/buf.length/30)}
  else{real=false;target=.5+.5*Math.sin(t/90)*Math.sin(t/230+1)}
  return Math.max(target,lv*.75); // ataque rapido, cierre suave
}

// ===== Render (aquí se reemplazaría el dibujo por sprites de un atlas) =====
const cv=$('c'),g=cv.getContext('2d'),W=854,H=480,K=2;
cv.width=W*K;cv.height=H*K;   // resolución interna x2: nítido en pantalla completa y retina
function puppet(id,pos,t){
  const w=S.who[id],c=CHARS[id];
  if(w.until&&t>w.until){w.st=S.mode==='music'?'dance':S.mode==='news'?'serio':'idle';w.until=0}
  const st=STATES[w.st],ser=S.mode==='news',dn=w.st==='dance';
  const ph=t/1000*st.spd*2+(id==='nova'?1:0);
  const beat=dn&&real?.4+lv:1;                       // bailando, el salto sigue el volumen real de la música
  const y=pos.y-Math.abs(Math.sin(ph))*st.bob*beat;
  const x=pos.x+(st.shake?Math.sin(t/30)*st.shake:0)+(dn?Math.sin(ph/2)*14:0);
  g.strokeStyle=c.body;g.lineWidth=10;g.lineCap='round';
  for(const k of[-1,1]){                              // brazos: arriba al bailar, al costado si está serio
    const ey=dn?y-140+Math.sin(ph*1.5+(k>0?0:2))*30:y-(ser?30:40)+Math.sin(ph)*3;
    g.beginPath();g.moveTo(x+k*35,y-80);g.lineTo(x+k*(dn?64:46),ey);g.stroke();
  }
  g.fillStyle=c.body;g.fillRect(x-35,y-90,70,90);
  if(ser){g.fillStyle='#e11d48';g.beginPath();g.moveTo(x-8,y-90);g.lineTo(x+8,y-90);g.lineTo(x+4,y-52);g.lineTo(x-4,y-52);g.fill()}   // corbata
  g.fillStyle=c.head;g.beginPath();g.arc(x,y-120,38,0,7);g.fill();
  g.strokeStyle=c.body;g.lineWidth=4;g.beginPath();g.moveTo(x,y-158);g.lineTo(x+10,y-182+Math.sin(ph*2)*4);g.stroke();
  const blink=(t%3000)<120?.1:1,e=(st.eyes||1);
  g.fillStyle='#1a1030';
  for(const dx of[-14,14]){g.beginPath();g.ellipse(x+dx,y-128,5*e,6*e*blink*(ser?.7:1),0,0,7);g.fill()}
  if(ser){g.strokeStyle='#1a1030';g.lineWidth=4;for(const k of[-1,1]){g.beginPath();g.moveTo(x+k*22,y-141);g.lineTo(x+k*7,y-135);g.stroke()}}   // ceño
  const m=w.st==='talk'?lv*(ser?.7:1):st.mouth*(dn?.5+.5*Math.sin(ph):1);
  g.beginPath();g.ellipse(x,y-106,(ser?7:9)+m*3,2+m*10,0,0,7);g.fill();
  g.fillStyle='#fff';g.font='12px system-ui';g.textAlign='center';g.fillText(c.name,x,pos.y+18);
}
function seg(t){
  const c=S.chyron;if(!c||!c.segments)return null;
  const m=mediaNow(),el=m!=null&&S.mstart!=null?m-S.mstart:(t-S.t0)/1000;let i=-1;
  c.segments.forEach((q,k)=>{if(q.at_s<=el)i=k});
  if(i!==S.seg){S.seg=i;S.chAt=t}                    // titular nuevo: el faldón vuelve a entrar
  return c.segments[i]||null;
}
// ===== Faldón (chyron): el contenido llega por la API en now_playing.chyron =====
function fit(s,w,px,wt){
  while(px>14){g.font=wt+px+'px system-ui';if(g.measureText(s).width<=w)return s;px-=2}
  g.font=wt+'14px system-ui';
  while(s.length>3&&g.measureText(s+'…').width>w)s=s.slice(0,-1);
  return s+'…';
}
function chyron(t){
  const c=S.chyron;g.textAlign='left';const sg=c&&seg(t);
  if(!c){   // sin noticia: tarjeta "Ahora suena"
    const k=Math.min(1,(t-S.chAt)/450);g.save();g.translate(-Math.pow(1-k,3)*W,0);
    g.font='bold 13px system-ui';const tg='AHORA SUENA',tw=g.measureText(tg).width+28;
    g.fillStyle='#ffb347';g.fillRect(30,396,tw,24);g.fillStyle='#1a1030';g.fillText(tg,44,413);
    g.fillStyle='rgba(12,10,32,.92)';g.fillRect(30,420,560,40);
    g.fillStyle='#fff';g.fillText(fit(S.track||'Música de la radio',530,22,'bold '),46,447);
    g.restore();return;
  }
  const k=Math.min(1,(t-S.chAt)/450);
  g.save();g.translate((Math.pow(1-k,3)*-1)*W,0);      // entra deslizando desde la izquierda
  g.font='bold 14px system-ui';const tag=((sg&&sg.tag)||c.tag||'').toUpperCase(),tw=g.measureText(tag).width+28;
  g.fillStyle='#e11d48';g.fillRect(30,344,tw,26);g.fillStyle='#fff';g.fillText(tag,44,362);
  if(c.segments&&S.seg>=0){g.font='bold 13px system-ui';g.textAlign='right';g.fillText((S.seg+1)+' / '+c.segments.length,824,362);g.textAlign='left'}   // nota N de M
  g.fillStyle='rgba(12,10,32,.92)';g.fillRect(30,370,794,48);
  g.fillStyle='#fff';g.fillText(fit((sg?sg.headline:c.headline)||'',760,26,'bold '),46,404);
  const dk=sg?sg.deck:c.deck;if(dk){g.fillStyle='rgba(42,26,74,.92)';g.fillRect(30,418,794,26);g.fillStyle='#ffd9a0';g.fillText(fit(dk,760,16,''),46,436)}
  g.fillStyle='#ffb347';g.fillRect(0,448,W,32);
  g.save();g.beginPath();g.rect(0,448,W,32);g.clip();
  g.fillStyle='#1a1030';g.font='bold 16px system-ui';
  const tk=c.ticker||(c.segments?c.segments.map(q=>q.headline).join('   •   '):c.source||S.title),wd=g.measureText(tk).width;
  g.fillText(tk,W-((t-S.t0)/18)%(W+wd),470);g.restore();g.restore();
}
function frame(t){
  requestAnimationFrame(frame);
  g.setTransform(K,0,0,K,0,0);
  lv=level(t);
  const mn=mediaNow();while(pending.length&&mn!=null&&mn>=pending[0].media_s)fire(pending.shift());   // eventos exactos por reloj de audio
  const sc=SCENES[S.scene],gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,sc.sky[0]);gr.addColorStop(1,sc.sky[1]);
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.fillStyle=sc.floor;g.fillRect(0,300,W,180);
  g.fillStyle=S.scene==='bar'?'#ff5d8f':'#5ef2ff';g.globalAlpha=.28;          // ecualizador de fondo: sigue el volumen
  for(let i=0;i<32;i++){const h=14+70*(real?lv:lv*.4)*(.35+.65*Math.abs(Math.sin(t/230+i*.8)));g.fillRect(14+i*26,300-h,16,h)}
  for(const p of sc.props){
    g.globalAlpha=p.live&&Math.floor(t/700)%2?.45:1;                           // "AL AIRE" parpadea
    g.fillStyle=p.c;
    if(p.t==='rect')g.fillRect(p.x,p.y,p.w,p.h);
    else{g.font=p.f;g.textAlign='center';g.fillText(p.s,p.x,p.y)}
  }
  g.globalAlpha=1;
  for(const id in sc.chars)puppet(id,sc.chars[id],t);
  chyron(t);
  const fa=1-(t-S.fadeAt)/450;if(fa>0){g.fillStyle='rgba(0,0,0,'+fa+')';g.fillRect(0,0,W,H)}
  g.textAlign='right';g.font='bold 14px system-ui';g.fillStyle='rgba(255,255,255,.85)';   // reloj y señal real
  g.fillText(new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}),W-18,28);
  if(real){g.fillStyle='#4ade80';g.beginPath();g.arc(W-70,23,4,0,7);g.fill()}
}
requestAnimationFrame(frame);

// ===== Fuente 1: demo =====
let demo=null;
$('bd').onclick=()=>{
  if(demo){clearInterval(demo);demo=null;$('bd').textContent='Iniciar demo';return}
  const seq=[{tipo:'music',titulo:'Loop de ejemplo'},{tipo:'news',titulo:'La nave sigue estacionada en el bar',chyron:{tag:'Último momento',headline:'La nave sigue estacionada frente al Bar Galáctico',deck:'Vecinos reportan luces de neón y música hasta la madrugada',ticker:'Clima despejado en toda la galaxia   •   Mercado de cometas en alza   •   Reabre la estación Nova',source:'Rocket Radio',segments:[{at_s:0,headline:'La nave sigue estacionada frente al Bar Galáctico',deck:'Vecinos reportan luces de neón y música hasta la madrugada'},{at_s:4,headline:'La consola Xbox se agota en segundos',deck:'Largas filas virtuales en la preventa de fin de año'},{at_s:8,headline:'Reabre la estación Nova tras la tormenta solar',deck:'Los vuelos se normalizan desde esta noche'}]}},{tipo:'spot',titulo:'Auspicia el Bar Galáctico'}];
  let i=0;const next=()=>RR.emit(seq[i++%3],true);
  next();demo=setInterval(next,12000);$('bd').textContent='Detener demo';
};

// ===== Fuente 2: radio real. Consulta /status (now_playing: null = música) =====
// Sincronizacion exacta: /status publica "timeline" (cada inicio de item con su instante en el reloj del stream).
// Cada evento se dispara cuando el audio del oyente llega a ese instante: sin retrasos estimados.
const seenTl=new Set(),pending=[];
const fire=e=>{if(['news','spot','music'].includes(e.kind))RR.emit({tipo:e.kind,titulo:e.title,chyron:e.chyron,mstart:e.media_s,elapsed:Math.max(0,(mediaNow()??e.media_s)-e.media_s)},true)};
function syncTimeline(tl){
  const m=mediaNow();let now=null;
  for(const e of tl){
    const k=e.media_s+'|'+(e.id||e.title);if(seenTl.has(k))continue;seenTl.add(k);
    if(e.media_s<=m)now=e;else pending.push(e);      // ya esta sonando / todavia no
  }
  if(now)fire(now);
}
let poll=null,last='';
$('dl').oninput=e=>{RR.delay=+e.target.value||0};
$('bc').onclick=()=>{
  clearInterval(poll);seenTl.clear();pending.length=0;last='';
  const base=$('u').value.trim().replace(/^wss:/,'https:').replace(/^ws:/,'http:').replace(/\/(listen)?\/?$/,'');
  if(!base){$('st').textContent='Sin conexión';return}
  try{localStorage.setItem('rr_url',base)}catch(_){}
  const tick=async()=>{
    try{
      const j=await(await fetch(base+'/status')).json(),np=j.now_playing;
      const key=np?np.kind+':'+(np.id||np.title):'music';
      if(j.timeline&&mediaNow()!=null)syncTimeline(j.timeline);
      else if(key!==last){last=key;pending.length=0;RR.emit(np?{tipo:np.kind,titulo:np.title,chyron:np.chyron,elapsed:np.elapsed_s}:{tipo:'music',titulo:'Música de la radio'})}   // sin reloj de audio: estimación de desfase
      $('st').textContent='Conectado, fuente: '+j.source+', oyentes: '+j.listeners+(mediaNow()!=null?', sync exacta con el reloj del audio':RR.lag!=null?', desfase auto: '+RR.lag.toFixed(1)+' s':', sin reloj de audio');
    }catch(_){$('st').textContent='No se pudo leer /status (revisá CORS y que sea https)'}
  };
  tick();poll=setInterval(tick,600);
};

const toggleFull=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
const toggleEmision=()=>document.body.classList.toggle('emision');
$('bf').onclick=toggleFull;$('bh').onclick=toggleEmision;
// ===== Fuente 3: teclado manual =====
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  const m={'1':()=>setScene('bar'),'2':()=>setScene('cabina'),
    m:()=>RR.emit({tipo:'music'},1),n:()=>RR.emit({tipo:'news',titulo:'Noticia manual'},1),
    s:()=>RR.emit({tipo:'spot',titulo:'Spot manual'},1),
    o:()=>setState('cap','oh',1200),t:()=>setState('nova','tos',1200),f:toggleFull,h:toggleEmision};
  (m[k]||(()=>{}))();
});
// ===== Arranque: ?radio=URL&modo=emision (sin panel, conecta solo). Sirviendo la pagina desde la radio usa su propio origen =====
{
  const q=new URLSearchParams(location.search);let saved='';
  try{saved=localStorage.getItem('rr_url')||''}catch(_){}
  const url=q.get('radio')||saved||(location.protocol.startsWith('http')?location.origin:'');
  $('u').value=url;
  if(q.get('modo')==='emision')document.body.classList.add('emision');
  if(url&&(q.get('modo')==='emision'||q.has('auto')))$('bc').click();
}
</script>
</body>
</html>
