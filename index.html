<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AETHERYON RADIO — LISTEN</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --void: #04040a;
  --deep: #080814;
  --surface: #0e0e1f;
  --border: #1e1e42;
  --cyan: #00f5d4;
  --cyan-dim: #00f5d411;
  --red: #ff3b5c;
  --amber: #ffb830;
  --muted: #5a5a8a;
  --text: #e8e8ff;
  --mono: 'Space Mono', monospace;
  --display: 'Bebas Neue', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--void);
  color: var(--text);
  font-family: var(--mono);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
body::after {
  content:'';
  position:fixed; inset:0;
  background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,245,212,.012) 2px,rgba(0,245,212,.012) 4px);
  pointer-events:none;
  z-index:9999;
}
.glow-ring {
  position:fixed;
  width:600px; height:600px;
  border-radius:50%;
  background: radial-gradient(circle, rgba(0,245,212,.06) 0%, transparent 70%);
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  animation: breathe 4s ease-in-out infinite;
}
@keyframes breathe {
  0%,100%{ transform:translate(-50%,-50%) scale(1); opacity:0.6 }
  50%    { transform:translate(-50%,-50%) scale(1.2); opacity:1 }
}
.card {
  position:relative; z-index:1;
  background:var(--deep);
  border:1px solid var(--border);
  border-radius:4px;
  padding:40px 48px;
  text-align:center;
  width:min(420px,94vw);
}
.station-name {
  font-family: var(--display);
  font-size: 42px;
  letter-spacing: 6px;
  color: var(--cyan);
  text-shadow: 0 0 30px var(--cyan);
  margin-bottom:6px;
}
.station-sub {
  font-size:10px;
  letter-spacing:4px;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:32px;
}
canvas {
  width:100%; height:80px;
  border-radius:2px;
  margin-bottom:24px;
  display:block;
}
.status-row {
  display:flex; align-items:center; justify-content:center;
  gap:10px; margin-bottom:28px;
  font-size:11px; letter-spacing:2px;
}
.dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
.dot.live      { background:var(--red);  animation:blink .8s infinite; box-shadow:0 0 8px var(--red); }
.dot.connected { background:var(--cyan); box-shadow:0 0 8px var(--cyan); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
#status-text { color:var(--muted); }
.btn-listen {
  width:100%;
  background:none;
  border:2px solid var(--cyan);
  color:var(--cyan);
  font-family:var(--display);
  font-size:22px;
  letter-spacing:4px;
  padding:16px;
  cursor:pointer;
  border-radius:2px;
  transition:all .2s;
  margin-bottom:20px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn-listen:hover  { background:var(--cyan-dim); }
.btn-listen.active { border-color:var(--amber); color:var(--amber); }
.vol-row {
  display:flex; align-items:center; gap:12px; margin-bottom:8px;
}
.vol-label { font-size:9px; letter-spacing:2px; color:var(--muted); white-space:nowrap; }
#vol {
  -webkit-appearance:none; flex:1; height:3px;
  background:var(--border); border-radius:2px; outline:none; cursor:pointer;
}
#vol::-webkit-slider-thumb {
  -webkit-appearance:none; width:20px; height:20px;
  border-radius:50%; background:var(--cyan); box-shadow:0 0 6px var(--cyan);
}
.server-row { display:flex; gap:8px; align-items:center; margin-top:20px; }
.server-row input {
  flex:1; background:var(--surface);
  border:1px solid var(--border); color:var(--text);
  font-family:var(--mono); font-size:10px;
  padding:8px 10px; border-radius:2px; outline:none;
}
.server-row input:focus { border-color:var(--cyan); }
.btn-mini {
  background:none; border:1px solid var(--border); color:var(--muted);
  font-family:var(--mono); font-size:9px; letter-spacing:1px;
  padding:8px 10px; cursor:pointer; border-radius:2px; white-space:nowrap;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn-mini:hover { border-color:var(--cyan); color:var(--cyan); }
</style>
</head>
<body>
<div class="glow-ring"></div>
<div class="card">
  <div class="station-name">AETHERYON</div>
  <div class="station-sub">Online Radio</div>
  <canvas id="viz"></canvas>
  <div class="status-row">
    <div class="dot" id="dot"></div>
    <span id="status-text">DISCONNECTED</span>
  </div>
  <button class="btn-listen" id="btn-listen">&#9654; TUNE IN</button>
  <div class="vol-row">
    <span class="vol-label">VOL</span>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
    <span class="vol-label" id="vol-pct">80%</span>
  </div>
  <div class="server-row">
    <input type="text" id="server-input" placeholder="wss://host/listen">
    <button class="btn-mini" id="btn-set">SET</button>
  </div>
</div>

<script>
// =====================================================
//  AETHERYON RADIO - Listener v3
//
//  v1 bug: <audio> off-DOM  → sourceopen nunca dispara en mobile
//  v2 bug: decodeAudioData no decodifica chunks WebM individuales
//          (WebM necesita el init segment = primeros bytes del stream)
//
//  v3 fix:
//    1. <audio> se agrega al DOM  → sourceopen dispara correctamente
//    2. AudioContext + resume()   → dentro del click handler (mobile policy)
//    3. audioEl.playsInline       → iOS no fuerza fullscreen
//    4. audioEl.play()            → llamado explícitamente post-sourceopen
//    5. MSE se mantiene          → correcto para streaming de chunks WebM
// =====================================================

var PING_INTERVAL = 20000;

function toWS(raw) {
  var s = String(raw || '').trim();
  if (!s) return '';
  if (s.startsWith('wss://') || s.startsWith('ws://')) return s;
  if (s.startsWith('https://')) return 'wss://' + s.substring(8);
  if (s.startsWith('http://'))  return 'ws://'  + s.substring(7);
  return (location.protocol === 'https:' ? 'wss://' : 'ws://') + s;
}

var rawParam  = new URLSearchParams(location.search).get('server') || '';
var serverUrl = toWS(rawParam);
document.getElementById('server-input').value = serverUrl;

var ws          = null;
var audioCtx    = null;
var analyser    = null;
var gainNode    = null;
var isListening = false;
var pingTimer   = null;
var audioEl     = null;
var mediaSource = null;
var sourceBuffer = null;
var sbReady     = false;
var queue       = [];

// Canvas
var canvas = document.getElementById('viz');
var ctx2d  = canvas.getContext('2d');
canvas.width  = canvas.offsetWidth || 340;
canvas.height = 80;

function drawViz() {
  requestAnimationFrame(drawViz);
  if (!analyser) {
    ctx2d.fillStyle = '#04040a';
    ctx2d.fillRect(0, 0, canvas.width, canvas.height);
    return;
  }
  var d = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(d);
  ctx2d.fillStyle = 'rgba(4,4,10,0.4)';
  ctx2d.fillRect(0, 0, canvas.width, canvas.height);
  var bw = canvas.width / d.length * 2.5;
  for (var i = 0; i < d.length; i++) {
    var h = (d[i] / 255) * canvas.height;
    ctx2d.fillStyle = 'hsl(' + (170 + i / d.length * 30) + ',100%,' + (40 + d[i]/255*30) + '%)';
    ctx2d.fillRect(i * bw, canvas.height - h, bw - 1, h);
  }
}
drawViz();

function setStatus(text, cls) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('dot').className = 'dot' + (cls ? ' ' + cls : '');
}

function getSupportedMime() {
  var types = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/ogg;codecs=opus',
    'audio/ogg',
    'audio/mp4;codecs=mp4a.40.2',
    'audio/mp4'
  ];
  for (var i = 0; i < types.length; i++) {
    if (MediaSource.isTypeSupported(types[i])) return types[i];
  }
  return '';
}

function appendNext() {
  if (!sbReady || !sourceBuffer || sourceBuffer.updating || queue.length === 0) return;
  try {
    sourceBuffer.appendBuffer(queue.shift());
  } catch(e) {
    // QuotaExceededError: limpiar buffer viejo y reintentar
    if (sourceBuffer.buffered && sourceBuffer.buffered.length) {
      var s = sourceBuffer.buffered.start(0);
      var end = sourceBuffer.buffered.end(0);
      if (end - s > 20) {
        try { sourceBuffer.remove(s, s + 10); } catch(_) {}
      }
    }
  }
}

function initAudio() {
  teardownAudio();

  // MOBILE FIX 1: AudioContext creado dentro del click handler
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  // MOBILE FIX 2: resume() explícito — Chrome mobile suspende por defecto
  audioCtx.resume();

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  gainNode = audioCtx.createGain();
  gainNode.gain.value = parseFloat(document.getElementById('vol').value);
  gainNode.connect(analyser);
  analyser.connect(audioCtx.destination);

  // MOBILE FIX 3: <audio> EN EL DOM
  // off-DOM → mediaSource.sourceopen nunca dispara en Chrome/Safari mobile
  audioEl = document.createElement('audio');
  audioEl.style.cssText = 'position:absolute;width:0;height:0;opacity:0;pointer-events:none;';
  audioEl.playsInline = true;  // MOBILE FIX 4: iOS no fullscreen
  document.body.appendChild(audioEl);

  var mediaSrc = audioCtx.createMediaElementSource(audioEl);
  mediaSrc.connect(gainNode);

  mediaSource = new MediaSource();
  audioEl.src = URL.createObjectURL(mediaSource);

  mediaSource.addEventListener('sourceopen', function() {
    var mime = getSupportedMime();
    if (!mime) { setStatus('CODEC NO SOPORTADO', ''); return; }
    try {
      sourceBuffer = mediaSource.addSourceBuffer(mime);
      sourceBuffer.mode = 'sequence';
      sourceBuffer.addEventListener('updateend', appendNext);
      sbReady = true;
      // MOBILE FIX 5: play() explícito post-sourceopen
      audioEl.play().catch(function() {});
      appendNext();
    } catch(e) {
      setStatus('MSE ERROR', '');
      console.error(e);
    }
  });
}

function teardownAudio() {
  sbReady = false;
  sourceBuffer = null;
  queue = [];

  if (mediaSource) {
    try { if (mediaSource.readyState === 'open') mediaSource.endOfStream(); } catch(_) {}
    mediaSource = null;
  }
  if (audioEl) {
    audioEl.pause();
    audioEl.src = '';
    if (audioEl.parentNode) audioEl.parentNode.removeChild(audioEl);
    audioEl = null;
  }
}

function connect() {
  var url = toWS(serverUrl);
  if (!url) { setStatus('INGRESA URL DEL SERVIDOR', ''); return; }

  setStatus('CONECTANDO...', '');
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = function() {
    setStatus('CONECTADO - ESPERANDO DJ', 'connected');
    pingTimer = setInterval(function() {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send('ping');
    }, PING_INTERVAL);
  };

  ws.onmessage = function(e) {
    if (typeof e.data === 'string') return;
    setStatus('EN VIVO', 'live');
    queue.push(e.data);
    appendNext();
  };

  ws.onclose = function() {
    setStatus('DESCONECTADO', '');
    clearInterval(pingTimer);
  };

  ws.onerror = function() {
    setStatus('ERROR DE CONEXION', '');
  };
}

function disconnect() {
  clearInterval(pingTimer);
  if (ws) { ws.close(); ws = null; }
  teardownAudio();
}

document.getElementById('btn-listen').addEventListener('click', function() {
  if (!isListening) {
    isListening = true;
    this.textContent = '\u23F9 DESCONECTAR';
    this.classList.add('active');
    initAudio();   // DENTRO del click - obligatorio para mobile
    connect();
  } else {
    isListening = false;
    this.textContent = '\u25B6 TUNE IN';
    this.classList.remove('active');
    disconnect();
    setStatus('DISCONNECTED', '');
  }
});

document.getElementById('btn-set').addEventListener('click', function() {
  serverUrl = toWS(document.getElementById('server-input').value.trim());
  document.getElementById('server-input').value = serverUrl;
  if (isListening) {
    disconnect();
    initAudio();
    connect();
  }
});

document.getElementById('vol').addEventListener('input', function() {
  if (gainNode) gainNode.gain.value = this.value;
  document.getElementById('vol-pct').textContent = Math.round(this.value * 100) + '%';
});
</script>
</body>
</html>
