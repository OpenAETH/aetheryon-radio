
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AETHERYON RADIO — LISTEN</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="/static/AETHERYON-Radio.ico">
<style>
:root {
  --void: #04040a;
  --deep: #080814;
  --surface: #0e0e1f;
  --border: #1e1e42;
  --cyan: #00f5d4;
  --cyan-dim: #00f5d411;
  --red: #ff3b5c;
  --amber: #ffb830;
  --muted: #5a5a8a;
  --text: #e8e8ff;
  --mono: 'Space Mono', monospace;
  --display: 'Bebas Neue', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--void);
  color: var(--text);
  font-family: var(--mono);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
body::after {
  content:'';
  position:fixed; inset:0;
  background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,245,212,.012) 2px,rgba(0,245,212,.012) 4px);
  pointer-events:none;
  z-index:9999;
}
.glow-ring {
  position:fixed;
  width:600px; height:600px;
  border-radius:50%;
  background: radial-gradient(circle, rgba(0,245,212,.06) 0%, transparent 70%);
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  animation: breathe 4s ease-in-out infinite;
}
@keyframes breathe {
  0%,100%{ transform:translate(-50%,-50%) scale(1); opacity:0.6 }
  50%    { transform:translate(-50%,-50%) scale(1.2); opacity:1 }
}
.card {
  position:relative; z-index:1;
  background:var(--deep);
  border:1px solid var(--border);
  border-radius:4px;
  padding:40px 48px;
  text-align:center;
  width:min(420px,94vw);
}
.station-name {
  font-family: var(--display);
  font-size: 42px;
  letter-spacing: 6px;
  color: var(--cyan);
  text-shadow: 0 0 30px var(--cyan);
  margin-bottom:6px;
}
.station-sub {
  font-size:10px;
  letter-spacing:4px;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:32px;
}
canvas {
  width:100%; height:80px;
  border-radius:2px;
  margin-bottom:24px;
  display:block;
}
.status-row {
  display:flex; align-items:center; justify-content:center;
  gap:10px; margin-bottom:28px;
  font-size:11px; letter-spacing:2px;
}
.dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
.dot.live      { background:var(--red);  animation:blink .8s infinite; box-shadow:0 0 8px var(--red); }
.dot.connected { background:var(--cyan); box-shadow:0 0 8px var(--cyan); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
#status-text { color:var(--muted); }
.btn-listen {
  width:100%;
  background:none;
  border:2px solid var(--cyan);
  color:var(--cyan);
  font-family:var(--display);
  font-size:22px;
  letter-spacing:4px;
  padding:16px;
  cursor:pointer;
  border-radius:2px;
  transition:all .2s;
  margin-bottom:20px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn-listen:hover  { background:var(--cyan-dim); }
.btn-listen.active { border-color:var(--amber); color:var(--amber); }
.vol-row {
  display:flex; align-items:center; gap:12px; margin-bottom:8px;
}
.vol-label { font-size:9px; letter-spacing:2px; color:var(--muted); white-space:nowrap; }
#vol {
  -webkit-appearance:none; flex:1; height:3px;
  background:var(--border); border-radius:2px; outline:none; cursor:pointer;
}
#vol::-webkit-slider-thumb {
  -webkit-appearance:none; width:20px; height:20px;
  border-radius:50%; background:var(--cyan); box-shadow:0 0 6px var(--cyan);
}
.server-row { display:flex; gap:8px; align-items:center; margin-top:20px; }
.server-row input {
  flex:1; background:var(--surface);
  border:1px solid var(--border); color:var(--text);
  font-family:var(--mono); font-size:10px;
  padding:8px 10px; border-radius:2px; outline:none;
}
.server-row input:focus { border-color:var(--cyan); }
.btn-mini {
  background:none; border:1px solid var(--border); color:var(--muted);
  font-family:var(--mono); font-size:9px; letter-spacing:1px;
  padding:8px 10px; cursor:pointer; border-radius:2px; white-space:nowrap;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn-mini:hover { border-color:var(--cyan); color:var(--cyan); }
.btn-mini.active { border-color:var(--amber); color:var(--amber); }
.source-label { font-size:9px; letter-spacing:2px; color:var(--muted); margin-top:18px; text-transform:uppercase; }
.source-label b { color:var(--cyan); font-weight:700; }
.btn-listen.attention { animation:attn 1.2s ease-in-out infinite; }
@keyframes attn { 0%,100%{ box-shadow:0 0 0 0 rgba(0,245,212,.5) } 50%{ box-shadow:0 0 0 10px transparent } }
.tap-hint { font-size:10px; letter-spacing:1px; color:var(--amber); margin:-8px 0 16px; }
.hidden { display:none !important; }
</style>
</head>
<body>
<div class="glow-ring"></div>
<div class="card">
  <div class="station-name">AETHERYON</div>
  <div class="station-sub">Online Radio</div>
  <canvas id="viz"></canvas>
  <div class="status-row">
    <div class="dot" id="dot"></div>
    <span id="status-text">DISCONNECTED</span>
  </div>
  <button class="btn-listen" id="btn-listen">&#9654; ESCUCHAR</button>
  <div class="vol-row">
    <span class="vol-label">VOL</span>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
    <span class="vol-label" id="vol-pct">80%</span>
  </div>
  <button class="btn-mini hidden" id="btn-wake" style="width:100%;margin:-8px 0 14px">PANTALLA ENCENDIDA: NO</button>
  <div class="tap-hint hidden" id="tap-hint">El navegador bloqueó el audio automático: tocá para escuchar</div>
  <div class="source-label" id="source-label">FUENTE: <b>AETHERYON RADIO</b> (LISTENER LOOP)</div>
  <div class="server-row">
    <input type="text" id="dj-input" placeholder="URL de DJ (opcional): wss://host/listen">
    <button class="btn-mini" id="btn-dj-set">SINTONIZAR</button>
    <button class="btn-mini hidden" id="btn-dj-clear">VOLVER A RADIO</button>
  </div>
</div>

<script>
// =====================================================
//  AETHERYON RADIO - Listener v3
//
//  v1 bug: <audio> off-DOM  → sourceopen nunca dispara en mobile
//  v2 bug: decodeAudioData no decodifica chunks WebM individuales
//          (WebM necesita el init segment = primeros bytes del stream)
//
//  v3 fix:
//    1. <audio> se agrega al DOM  → sourceopen dispara correctamente
//    2. AudioContext + resume()   → dentro del click handler (mobile policy)
//    3. audioEl.playsInline       → iOS no fuerza fullscreen
//    4. audioEl.play()            → llamado explícitamente post-sourceopen
//    5. MSE se mantiene          → correcto para streaming de chunks WebM
// =====================================================

var PING_INTERVAL = 20000;

function toWS(raw) {
  var s = String(raw || '').trim();
  if (!s) return '';
  if (s.startsWith('wss://') || s.startsWith('ws://')) return s;
  if (s.startsWith('https://')) return 'wss://' + s.substring(8);
  if (s.startsWith('http://'))  return 'ws://'  + s.substring(7);
  return (location.protocol === 'https:' ? 'wss://' : 'ws://') + s;
}

function sameOriginWS(path) {
  return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + path;
}

// Fuente por defecto: Listener Loop, emitido por el backend que sirve esta pagina.
// Unica configuracion opcional: URL publica de un DJ (se recuerda en este navegador).
var DJ_KEY = 'aetheryon_dj_url';
function normalizeDj(raw) {
  var ws = toWS(raw);
  if (!ws) return '';
  try {
    var u = new URL(ws);
    if (u.pathname === '' || u.pathname === '/') u.pathname = '/listen';
    return u.toString();
  } catch (_) { return ''; }
}
function loadDj() {
  var fromParam = new URLSearchParams(location.search).get('server');
  if (fromParam) return normalizeDj(fromParam);
  try { return normalizeDj(localStorage.getItem(DJ_KEY) || ''); } catch (_) { return ''; }
}
function saveDj(url) {
  try { if (url) localStorage.setItem(DJ_KEY, url); else localStorage.removeItem(DJ_KEY); } catch (_) {}
}
var djUrl = loadDj();
function currentSource() { return djUrl || sameOriginWS('/listen'); }
function renderSource() {
  var label = document.getElementById('source-label');
  if (djUrl) {
    var host = '';
    try { host = new URL(djUrl).host; } catch (_) { host = djUrl; }
    label.innerHTML = 'FUENTE: DJ <b></b>';
    label.querySelector('b').textContent = host;
  } else {
    label.innerHTML = 'FUENTE: <b>AETHERYON RADIO</b> (LISTENER LOOP)';
  }
  document.getElementById('btn-dj-clear').classList.toggle('hidden', !djUrl);
  document.getElementById('dj-input').value = djUrl;
}

var ws          = null;
var audioCtx    = null;
var analyser    = null;
var rrAnalyser  = null;   // Rocket Radio: nivel de voz sin pasar por el volumen
var gainNode    = null;
var audioEnabled = false;   // true = sonando (autoplay ok o tras un toque)
var userMuted   = false;   // el oyente silencio explicitamente
var pingTimer   = null;
var audioEl     = null;
var mediaSource = null;
var sourceBuffer = null;
var sbReady     = false;
var queue       = [];
var currentMime = 'audio/webm;codecs="opus"';
var currentSession = null;
var retryTimer  = null;
var retryCount  = 0;

// Segundo plano (pantalla apagada): en moviles el audio va DIRECTO del <audio> al sistema (sin WebAudio).
// WebAudio se suspende al bloquear la pantalla y se lleva el sonido; con el <audio> solo, Android/iOS lo mantienen
// y muestran los controles de bloqueo (Media Session). En escritorio se conserva WebAudio (visualizador, volumen).
// Forzar: ?webaudio=1 (con WebAudio) o ?webaudio=0 (sin WebAudio).
var IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                (navigator.maxTouchPoints > 1 && /Mac/i.test(navigator.platform));
var USE_WEBAUDIO = /[?&]webaudio=1/.test(location.search) || (!IS_MOBILE && !/[?&]webaudio=0/.test(location.search));

// Canvas
var canvas = document.getElementById('viz');
var ctx2d  = canvas.getContext('2d');
var vizW = 0, vizH = 0, vizGrad = null;
function sizeViz() {
  // Tamano real en pixeles de dispositivo; se recalcula al rotar/redimensionar (antes se fijaba una sola vez)
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  var w = Math.max(canvas.clientWidth || canvas.parentNode.clientWidth || 340, 1);
  var h = canvas.clientHeight || 80;
  if (w * dpr === vizW && h * dpr === vizH) return;
  vizW = canvas.width = Math.round(w * dpr);
  vizH = canvas.height = Math.round(h * dpr);
  vizGrad = ctx2d.createLinearGradient(0, vizH, 0, 0);   // gradiente solido, sin depender de hsl()/alfa por barra
  vizGrad.addColorStop(0, '#00a6a0');
  vizGrad.addColorStop(0.6, '#00ffd0');
  vizGrad.addColorStop(1, '#7dffee');
}
sizeViz();
window.addEventListener('resize', sizeViz);
window.addEventListener('orientationchange', sizeViz);

// Barras sobre todo el ancho, escala logaritmica de frecuencias (la voz vive en las primeras bandas).
// Sin analizador (movil), contexto suspendido o pestana silenciada, cae a una animacion sintetica mientras suena
// y a una linea base tenue en reposo: el visualizador nunca queda en blanco.
var VIZ_BARS = 48, vizBuf = null, vizSmooth = new Array(VIZ_BARS);
for (var vi = 0; vi < VIZ_BARS; vi++) vizSmooth[vi] = 0;

function drawViz(now) {
  requestAnimationFrame(drawViz);
  sizeViz();
  var W = vizW, H = vizH, i, v, data = null, energy = 0;
  if (analyser) {
    if (!vizBuf || vizBuf.length !== analyser.frequencyBinCount) vizBuf = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(vizBuf);
    for (i = 0; i < vizBuf.length; i++) energy += vizBuf[i];
    if (energy > 0) data = vizBuf;
  }
  var sounding = !!(audioEl && !audioEl.paused);
  var t = (now || 0) / 1000;
  ctx2d.fillStyle = '#04040a';
  ctx2d.fillRect(0, 0, W, H);
  var gap = Math.max(1, Math.round(W / VIZ_BARS * 0.25)), bw = W / VIZ_BARS;
  ctx2d.fillStyle = vizGrad || '#00ffd0';
  for (i = 0; i < VIZ_BARS; i++) {
    var target;
    if (data) {
      var lo = Math.floor(Math.pow(i / VIZ_BARS, 2) * (data.length - 1));
      var hi = Math.max(lo + 1, Math.floor(Math.pow((i + 1) / VIZ_BARS, 2) * (data.length - 1)));
      var m = 0;
      for (var k = lo; k < hi && k < data.length; k++) if (data[k] > m) m = data[k];
      target = m / 255;
    } else if (sounding) {
      target = 0.18 + 0.32 * (0.5 + 0.5 * Math.sin(t * 3.1 + i * 0.55)) * (0.6 + 0.4 * Math.sin(t * 1.7 + i * 1.3));
    } else {
      target = 0.04;
    }
    vizSmooth[i] += (target - vizSmooth[i]) * (target > vizSmooth[i] ? 0.6 : 0.18);
    var h = Math.max(2, vizSmooth[i] * H);
    ctx2d.fillRect(Math.round(i * bw), H - h, Math.max(1, Math.round(bw - gap)), h);
  }
}
requestAnimationFrame(drawViz);

function setStatus(text, cls) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('dot').className = 'dot' + (cls ? ' ' + cls : '');
}

function getSupportedMime() {
  var candidates = [currentMime, 'audio/webm;codecs=opus', 'audio/webm'];
  for (var i = 0; i < candidates.length; i++) {
    if (candidates[i] && MediaSource.isTypeSupported(candidates[i])) return candidates[i];
  }
  return '';
}

// Un oyente que entra con la emision en curso recibe timestamps que no empiezan en 0:
// el buffer arranca en t=start y el <audio> quedaria clavado en currentTime=0 (silencio).
// Se salta al inicio del buffer y se recorta lo ya reproducido para no agotar la cuota.
function onUpdateEnd() {
  try {
    if (audioEl && sourceBuffer && audioEl.buffered.length) {
      var start = audioEl.buffered.start(0);
      var cur = audioEl.currentTime;
      if (cur + 0.05 < start) {
        audioEl.currentTime = start;
      } else if (cur - start > 30 && !sourceBuffer.updating) {
        sourceBuffer.remove(start, cur - 20);
        return;   // el remove dispara otro updateend que continua la cola
      }
    }
  } catch (_) {}
  appendNext();
}

function appendNext() {
  // sbReady se pone false en teardownAudio() — guard principal
  if (!sbReady || !sourceBuffer || sourceBuffer.updating || queue.length === 0) return;
  // Verificar que el MediaSource sigue abierto antes de tocar el SourceBuffer
  if (!mediaSource || mediaSource.readyState !== 'open') return;
  try {
    sourceBuffer.appendBuffer(queue.shift());
  } catch(e) {
    // Solo intentar limpiar si el SB sigue adjunto al MediaSource
    if (e.name === 'QuotaExceededError' && mediaSource && mediaSource.readyState === 'open') {
      try {
        var buffered = sourceBuffer.buffered;
        if (buffered.length) {
          var s = buffered.start(0);
          var end = buffered.end(0);
          if (end - s > 20) sourceBuffer.remove(s, s + 10);
        }
      } catch(_) {}
    }
  }
}

function initAudio() {
  teardownAudio();

  if (USE_WEBAUDIO) {
    // MOBILE FIX 1: AudioContext creado dentro del click handler
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    // MOBILE FIX 2: resume() explícito — Chrome mobile suspende por defecto
    audioCtx.resume();

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    gainNode = audioCtx.createGain();
    gainNode.gain.value = parseFloat(document.getElementById('vol').value);
    gainNode.connect(analyser);
    analyser.connect(audioCtx.destination);
  }

  // MOBILE FIX 3: <audio> EN EL DOM
  // off-DOM → mediaSource.sourceopen nunca dispara en Chrome/Safari mobile
  audioEl = document.createElement('audio');
  audioEl.style.cssText = 'position:absolute;width:0;height:0;opacity:0;pointer-events:none;';
  audioEl.playsInline = true;  // MOBILE FIX 4: iOS no fullscreen
  audioEl.muted = userMuted;
  document.body.appendChild(audioEl);

  if (USE_WEBAUDIO) {
    var mediaSrc = audioCtx.createMediaElementSource(audioEl);
    mediaSrc.connect(gainNode);

    // Rocket Radio: analizador tomado ANTES del volumen, para animar la boca con la voz real
    rrAnalyser = audioCtx.createAnalyser();
    rrAnalyser.fftSize = 256;
    mediaSrc.connect(rrAnalyser);
  } else {
    audioEl.volume = parseFloat(document.getElementById('vol').value);   // iOS ignora volume: usa los botones del equipo
  }

  mediaSource = new MediaSource();
  audioEl.src = URL.createObjectURL(mediaSource);

  mediaSource.addEventListener('sourceopen', function() {
    var mime = getSupportedMime();
    if (!mime) { setStatus('CODEC NO SOPORTADO', ''); return; }
    try {
      sourceBuffer = mediaSource.addSourceBuffer(mime);
      sourceBuffer.mode = 'segments';
      sourceBuffer.addEventListener('updateend', onUpdateEnd);
      sbReady = true;
      // MOBILE FIX 5: play() explícito post-sourceopen
      audioEl.play().catch(function() {});
      appendNext();
    } catch(e) {
      setStatus('MSE ERROR', '');
      console.error(e);
    }
  });
}

// Rocket Radio: publica el nivel de audio (0..1) para la animacion (misma origen/navegador)
var rrChannel = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('rocket-radio') : null;
var rrBuf = new Uint8Array(256);
setInterval(function() {
  if (!rrChannel || (!rrAnalyser && !audioEl)) return;
  var sum = 0;
  if (rrAnalyser) {          // sin WebAudio (moviles) no hay nivel de voz, pero pos/lag siguen sincronizando titulares
    rrAnalyser.getByteTimeDomainData(rrBuf);
    for (var i = 0; i < rrBuf.length; i++) { var v = (rrBuf[i] - 128) / 128; sum += v * v; }
  }
  // desfase real: cuanto audio ya recibido falta por sonar (el servidor cambia de item antes de que lo oigas)
  var lag = 0;
  if (audioEl && audioEl.buffered && audioEl.buffered.length) {
    lag = audioEl.buffered.end(audioEl.buffered.length - 1) - audioEl.currentTime;
  }
  var lvl = Math.min(1, Math.sqrt(sum / rrBuf.length) * 5);
  if (!rrAnalyser) {         // sin WebAudio: animacion sintetica de la boca mientras suena (misma que usa Rocket Radio sin datos)
    var tn = Date.now();
    lvl = (audioEl && !audioEl.paused && !audioEl.muted) ? 0.5 + 0.5 * Math.sin(tn / 90) * Math.sin(tn / 230 + 1) : 0;
  }
  rrChannel.postMessage({ level: lvl, lag: lag > 0 ? lag : 0,
                         pos: audioEl ? audioEl.currentTime : 0, playing: !!(audioEl && !audioEl.paused) });
}, 40);

function teardownAudio() {
  // Bajar el flag PRIMERO — cualquier updateend o onmessage en vuelo
  // encontrará sbReady=false y saldrá sin tocar el SourceBuffer
  sbReady = false;
  queue   = [];

  // Remover el listener de updateend antes de soltar la referencia
  if (sourceBuffer) {
    try { sourceBuffer.removeEventListener('updateend', onUpdateEnd); } catch(_) {}
    sourceBuffer = null;
  }

  if (mediaSource) {
    try { if (mediaSource.readyState === 'open') mediaSource.endOfStream(); } catch(_) {}
    mediaSource = null;
  }
  if (audioEl) {
    audioEl.pause();
    audioEl.src = '';
    if (audioEl.parentNode) audioEl.parentNode.removeChild(audioEl);
    audioEl = null;
  }
}

function setListening(on) {
  audioEnabled = on;
  var btn = document.getElementById('btn-listen');
  btn.textContent = on ? '\u23F8 SILENCIAR' : '\u25B6 ESCUCHAR';
  btn.classList.toggle('active', on);
  if (audioEl) audioEl.muted = !on;
  if (typeof updateMediaState === 'function') updateMediaState();
}

function showTapHint(show) {
  document.getElementById('tap-hint').classList.toggle('hidden', !show);
  document.getElementById('btn-listen').classList.toggle('attention', !!show);
}

// Intenta reproducir; si el navegador bloquea el autoplay, muestra el control para hacerlo con un toque.
function tryPlay() {
  if (!audioEl) return;
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(function() {});
  audioEl.play().catch(function() {});
  setTimeout(function() {
    var ctxOk = !USE_WEBAUDIO || (audioCtx && audioCtx.state === 'running');
    var blocked = !audioEl || audioEl.paused || !ctxOk;
    showTapHint(blocked && !audioEnabled && !userMuted);
    if (!blocked && !userMuted) setListening(true);   // autoplay permitido: ya esta sonando
  }, 400);
}

function connect() {
  clearTimeout(retryTimer);
  var url = currentSource();
  setStatus(djUrl ? 'CONECTANDO AL DJ...' : 'CONECTANDO A LA RADIO...', '');
  var sock;
  try { sock = new WebSocket(url); } catch (e) { setStatus('URL INVALIDA', ''); return; }
  ws = sock;
  sock.binaryType = 'arraybuffer';

  sock.onopen = function() {
    if (ws !== sock) return;
    retryCount = 0;
    setStatus(djUrl ? 'CONECTADO - DJ' : 'CONECTADO - AETHERYON RADIO', 'connected');
    clearInterval(pingTimer);
    pingTimer = setInterval(function() {
      if (sock.readyState === WebSocket.OPEN) sock.send('ping');
    }, PING_INTERVAL);
  };

  sock.onmessage = function(e) {
    if (ws !== sock) return;
    if (typeof e.data === 'string') {
      var control;
      try { control = JSON.parse(e.data); } catch (_) { return; }
      if (control.type === 'stream_start') {
        // Nueva sesion/fuente: invalidar la cola MSE antes de aceptar bytes.
        currentSession = control.session_id;
        currentMime = control.mime || 'audio/webm;codecs="opus"';
        teardownAudio();
        initAudio();
        setStatus('SINCRONIZANDO STREAM...', 'connected');
        tryPlay();
      } else if (control.type === 'waiting') {
        setStatus('ESPERANDO TRANSMISION', 'connected');
      }
      return;
    }
    if (!sbReady && !mediaSource) return;
    setStatus('EN VIVO', 'live');
    queue.push(e.data);
    appendNext();
  };

  sock.onclose = function() {
    if (ws !== sock) return;   // cierre intencional (cambio de fuente)
    clearInterval(pingTimer);
    // Radio siempre disponible: reconectar con backoff (cubre reinicios/despliegues del backend).
    var delay = Math.min(1000 * Math.pow(2, retryCount++), 15000);
    setStatus('RECONECTANDO...', '');
    retryTimer = setTimeout(connect, delay);
  };

  sock.onerror = function() {
    if (ws !== sock) return;
    setStatus('ERROR DE CONEXION', '');
  };
}

function disconnect() {
  clearTimeout(retryTimer);
  clearInterval(pingTimer);
  var old = ws;
  ws = null;                     // marca el cierre como intencional
  if (old) { try { old.close(); } catch (_) {} }
  teardownAudio();
}

function switchSource(newDjUrl) {
  djUrl = newDjUrl;
  saveDj(djUrl);
  renderSource();
  retryCount = 0;
  disconnect();
  connect();
}

document.getElementById('btn-listen').addEventListener('click', function() {
  // Gesto del usuario: desbloquea/reanuda la reproduccion. La conexion ya esta activa.
  if (!audioEnabled) {
    userMuted = false;
    setListening(true);
    showTapHint(false);
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(function() {});
    if (audioEl) audioEl.play().catch(function() {});
  } else {
    userMuted = true;
    setListening(false);   // radio en vivo: silenciar, no pausar (evita desfase)
  }
});

document.getElementById('btn-dj-set').addEventListener('click', function() {
  var raw = document.getElementById('dj-input').value.trim();
  if (!raw) { if (djUrl) switchSource(''); return; }   // campo vacio = volver a la radio propia
  var norm = normalizeDj(raw);
  if (!norm) { setStatus('URL DE DJ INVALIDA', ''); return; }
  if (location.protocol === 'https:' && norm.indexOf('ws://') === 0) {
    setStatus('USA wss:// (esta pagina es HTTPS)', ''); return;
  }
  switchSource(norm);
});

document.getElementById('btn-dj-clear').addEventListener('click', function() { switchSource(''); });

// Entrada automatica: el oyente se conecta al Listener Loop sin configurar nada.
renderSource();
connect();

// ---------- Segundo plano: controles de bloqueo, recuperacion y pantalla encendida ----------
var nowTitle = '';
function updateMediaState() {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.playbackState = (audioEnabled && !userMuted) ? 'playing' : 'paused';
    if (typeof MediaMetadata !== 'undefined') {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: nowTitle || 'En vivo', artist: 'AETHERYON RADIO', album: 'Listener Loop' });
    }
  } catch (_) {}
}
function mediaPlay() {
  userMuted = false;
  setListening(true);
  showTapHint(false);
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(function() {});
  if (audioEl) audioEl.play().catch(function() {});
}
function mediaMute() { userMuted = true; setListening(false); }   // radio en vivo: silenciar, no pausar (evita desfase)
if ('mediaSession' in navigator) {
  try {
    navigator.mediaSession.setActionHandler('play', mediaPlay);
    navigator.mediaSession.setActionHandler('pause', mediaMute);
    navigator.mediaSession.setActionHandler('stop', mediaMute);
  } catch (_) {}
  updateMediaState();
}

// Titulo en pantalla de bloqueo: lo que suena segun /status (solo con la radio propia).
function pollNowPlaying() {
  if (djUrl) { if (nowTitle) { nowTitle = ''; updateMediaState(); } return; }
  fetch('/status', { cache: 'no-store' }).then(function(r) { return r.json(); }).then(function(st) {
    var t = (st && st.now_playing && st.now_playing.title) || '';
    if (t !== nowTitle) { nowTitle = t; updateMediaState(); }
  }).catch(function() {});
}
setInterval(pollNowPlaying, 20000);
pollNowPlaying();

// El sistema puede pausar el <audio> (bloqueo, llamada, otra app): si el oyente no pidio silencio, se reanuda
// y se salta al borde en vivo (lo acumulado mientras estuvo pausado ya no es "en vivo").
function resumeLive() {
  if (!audioEl || userMuted || !audioEnabled) return;
  try {
    if (audioEl.buffered.length) {
      var end = audioEl.buffered.end(audioEl.buffered.length - 1);
      if (end - audioEl.currentTime > 8) audioEl.currentTime = Math.max(audioEl.buffered.start(0), end - 1);
    }
  } catch (_) {}
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(function() {});
  audioEl.play().catch(function() {});
}
setInterval(function() {      // vigilante: el audio deberia estar sonando
  if (audioEl && audioEnabled && !userMuted && audioEl.paused && sbReady) resumeLive();
}, 3000);
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState !== 'visible') return;
  if (!ws || ws.readyState > 1) { retryCount = 0; connect(); }   // el socket murio en segundo plano
  resumeLive();
  if (wakeWanted) requestWake();
});

// Pantalla encendida (opcional): evita que el telefono se bloquee mientras escuchas.
var wakeLock = null, wakeWanted = false;
function requestWake() {
  if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
  navigator.wakeLock.request('screen').then(function(l) {
    wakeLock = l;
    l.addEventListener('release', function() { if (wakeLock === l) wakeLock = null; });
  }).catch(function() {});
}
(function() {
  var btn = document.getElementById('btn-wake');
  if (!('wakeLock' in navigator) || !IS_MOBILE) return;   // en escritorio no hace falta
  btn.classList.remove('hidden');
  try { wakeWanted = localStorage.getItem('aetheryon_wake') === '1'; } catch (_) {}
  function paint() { btn.textContent = 'PANTALLA ENCENDIDA: ' + (wakeWanted ? 'SI' : 'NO'); btn.classList.toggle('active', wakeWanted); }
  paint();
  btn.addEventListener('click', function() {
    wakeWanted = !wakeWanted;
    try { localStorage.setItem('aetheryon_wake', wakeWanted ? '1' : '0'); } catch (_) {}
    if (wakeWanted) requestWake(); else if (wakeLock) { wakeLock.release().catch(function() {}); wakeLock = null; }
    paint();
  });
  if (wakeWanted) document.addEventListener('click', function once() { requestWake(); document.removeEventListener('click', once); });
})();

document.getElementById('vol').addEventListener('input', function() {
  if (gainNode) gainNode.gain.value = this.value;
  else if (audioEl) audioEl.volume = parseFloat(this.value);
  document.getElementById('vol-pct').textContent = Math.round(this.value * 100) + '%';
});
</script>
